<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Misère Perdue · Not found</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#040a1f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#040a1f" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/favicon.png">
  <style>
    :root { --bg:#070f29; --ink:#f5f5f7; --muted:#b7bdd0; --accent:#a9d7f5; --fill:rgba(255,255,255,.06); --hair:rgba(255,255,255,.12); --glow:rgba(169,215,245,.13); color-scheme:dark; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#ffffff; --ink:#1c1c1e; --muted:#636366; --accent:#0a1230; --fill:#f4f4f6; --hair:rgba(0,0,0,.08); --glow:rgba(10,18,48,.07); color-scheme:light; }
    }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; overflow:hidden; scrollbar-width:none; box-sizing:border-box; }
    body { min-height:100svh; display:grid; place-items:center; padding:24px 20px calc(24px + env(safe-area-inset-bottom));
      background:radial-gradient(120% 70% at 50% 0%, var(--glow), transparent 70%), var(--bg); color:var(--ink);
      font:16px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; text-align:center; -webkit-font-smoothing:antialiased; }
    main { width:100%; max-width:340px; }
    .eyes { width:150px; height:39px; margin:0 auto 34px; background:var(--accent);
      -webkit-mask:url(/img/splash-eyes.png) center/contain no-repeat; mask:url(/img/splash-eyes.png) center/contain no-repeat;
      animation:sigh 5s ease-in-out infinite; }
    @keyframes sigh { 0%,100% { transform:translateY(0); opacity:1; } 50% { transform:translateY(3px); opacity:.82; } }
    .kicker { font:600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.32em; color:var(--muted); margin:0 0 14px; text-transform:uppercase; }
    h1 { font-size:26px; line-height:1.1; margin:0 0 28px; font-weight:800; letter-spacing:-.02em; }
    p.sub { margin:0 0 28px; color:var(--muted); font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    a.home { display:inline-block; padding:12px 26px; border-radius:999px; background:var(--accent); color:var(--bg);
      text-decoration:none; font-weight:800; font-size:13px; letter-spacing:.02em; }
    a.home:active { opacity:.8; }
    @media (prefers-reduced-motion: reduce) { .eyes { animation:none; } }
      html::-webkit-scrollbar, body::-webkit-scrollbar { display:none; width:0; height:0; }
  </style>
</head>
<body>
  <main>
    <div class="eyes" role="img" aria-label="Closed eyes"></div>
    <p class="kicker">MISERY · 404</p>
    <h1>Nothing here</h1>
    <a class="home" href="/">Back to Misery</a>
  </main>
</body>
</html>
