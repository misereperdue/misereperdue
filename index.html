<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#000000">
  <title>MISERY</title>
  <link rel="stylesheet" href="css/site.css?v=48">
  <script src="js/theme.js?v=7"></script>
</head>
<body class="home">
  <header class="hero">
    <video class="sharp" autoplay muted loop playsinline preload="auto" poster="video/header.jpg">
      <source src="video/header-ping.mp4" type="video/mp4">
    </video>
    <video class="soft" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="video/header-ping.mp4" type="video/mp4">
    </video>
    <div class="hero-fade"></div>
  </header>
  <div class="nav-wrap">
    <nav class="nav" id="nav" aria-label="Main">
      <span class="seg" aria-hidden="true"></span>
      <button type="button" class="on" data-view="journal" aria-label="Home"><svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19V6.5L12 13l6-6.5V19"/></svg></button>
      <button type="button" data-view="shop" aria-label="Store">
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 8.5h11l-.8 10.2a1.5 1.5 0 0 1-1.5 1.3H8.8a1.5 1.5 0 0 1-1.5-1.3L6.5 8.5z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/></svg>
      </button>
      <button type="button" data-view="cart" aria-label="Bag" id="cart-btn" class="cart-btn hidden">
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h7.9a1.5 1.5 0 0 0 1.5-1.2L20.5 8H6"/></svg>
        <span class="badge hidden" id="cart-badge" aria-hidden="true">0</span>
      </button>
      <span class="split" aria-hidden="true"></span>
      <button type="button" class="page-btn" data-view="post" aria-label="Post" id="post-btn">
        <svg class="mark ic-post" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.2 4.8l5 5L9.4 19.6 4.5 20l.4-4.9z"/><path d="M12.6 6.4l5 5"/></svg>
        <svg class="mark ic-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h7.9a1.5 1.5 0 0 0 1.5-1.2L20.5 8H6"/></svg>
        <span class="badge hidden" id="post-badge" aria-hidden="true">0</span>
      </button>
    </nav>
  </div>
  <main class="page">
    <section class="panel on" id="journal"><div class="feed" id="feed"></div></section>
    <section class="panel" id="shop"><div class="grid" id="shop-grid"></div></section>
    <section class="panel" id="cart">
      <div id="cart-lines"></div>
      <p class="meta" id="cart-total"></p>
      <div class="row">
        <button class="btn accent" id="checkout-btn" type="button">Checkout</button>
      </div>
      <p class="meta" id="checkout-err" style="margin-top:12px"></p>
    </section>
    <section class="panel" id="postview"></section>
  </main>
  <script src="js/blog.js?v=6"></script>
  <script src="js/store.js?v=6"></script>
  <script src="js/shopify.js?v=8"></script>
  <script src="js/comments.js?v=4"></script>
  <script src="js/shop.js?v=12"></script>
  <script>
    var nav = document.getElementById("nav");
    var posts = [];
    var current = { type: "journal", id: "" };

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
      });
    }
    function byline(name, date) {
      return '<div class="byline">' + MPComments.avatarHTML(name) +
        "<span>" + esc(name) + '</span><span class="bar">|</span><span>' + esc(date) + "</span></div>";
    }
    function refreshSeg() {
      requestAnimationFrame(function () {
        var t = current.type === "product" ? "shop" : current.type;
        var btn = nav.querySelector('button[data-view="' + t + '"]') ||
                  nav.querySelector('button[data-view="journal"]');
        if (btn) nav.querySelector(".seg").style.transform = "translateX(" + (btn.offsetLeft - 4) + "px)";
      });
    }
    function refreshPostBtn() {
      var btn = document.getElementById("post-btn");
      var badge = document.getElementById("post-badge");
      var cartBtn = document.getElementById("cart-btn");
      var split = nav.querySelector(".split");
      if (!btn || !window.MP) return;
      var onProduct = current.type === "product";
      var onPost = current.type === "post";
      var n = MP.cartCount();
      // the bag always lives in the sectioned area; on product pages the sectioned slot becomes the bag
      var bagMode = onProduct && n > 0;
      var showPencil = bagMode || onPost;
      var showSplit = bagMode || onPost || n > 0;
      btn.classList.toggle("bag-mode", bagMode);
      btn.style.display = showPencil ? "grid" : "none";
      if (split) split.style.display = showSplit ? "block" : "none";
      btn.setAttribute("aria-label", bagMode ? "Bag" : "Post");
      if (badge) {
        badge.classList.toggle("hidden", !bagMode || n === 0);
        badge.textContent = n > 99 ? "99+" : String(n);
      }
      // the sectioned bag replaces the regular cart tab on product pages
      if (cartBtn) cartBtn.classList.toggle("hidden", bagMode ? true : n === 0);
    }
    function show(view, id) {
      current = { type: view, id: id || "" };
      var reading = view === "post" || view === "product";
      document.getElementById("journal").classList.toggle("on", view === "journal");
      document.getElementById("shop").classList.toggle("on", view === "shop");
      document.getElementById("cart").classList.toggle("on", view === "cart");
      document.getElementById("postview").classList.toggle("on", reading);
      nav.classList.toggle("shop", view === "shop");
      nav.classList.toggle("cart", view === "cart");
      nav.classList.toggle("reading", reading);
      nav.querySelectorAll("button").forEach(function (b) {
        var active = b.dataset.view === view ||
          (view === "product" && b.dataset.view === "shop");
        b.classList.toggle("on", active);
      });
      if (reading) window.scrollTo(0, 0);
      if (view === "shop") MPShop.renderShop();
      if (view === "cart") MPShop.renderCartPanel();
      refreshSeg();
      refreshPostBtn();
      history.replaceState(null, "", view === "shop" ? "#shop" : view === "cart" ? "#cart" : reading ? "#post" : "#");
    }
    window.MPNav = {
      show: show,
      refreshSeg: refreshSeg,
      refreshPostBtn: refreshPostBtn,
      showProduct: function (id) { show("product", id); },
      reopen: function () {
        if (current.type === "product" && current.id) MPShop.openProduct(current.id);
        else if (current.type === "post" && current.id) openPost(current.id);
      }
    };

    var X_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';

    function openPost(slug) {
      var post = posts.find(function (p) { return (p.slug || p._id) === slug; }) || posts[0];
      if (!post) return;
      var id = post.slug || post._id;
      current = { type: "post", id: id };
      var date = (post.publishedAt || "").slice(0, 10);
      var title = post.title || "Untitled";
      var author = post.author || "dc";
      var share = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(title) + "&url=" + encodeURIComponent("https://misereperdue.com/");
      document.getElementById("postview").innerHTML =
        '<article class="article-card">' + byline(author, date) +
        "<h1>" + esc(title) + '</h1><div class="post-body">' +
        SanityBlog.textFrom(post.body).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
        '</div><div class="actions">' +
        '<a class="share" href="' + share + '" target="_blank" rel="noopener">' + X_SVG + "Share on X</a>" +
        '<span class="split"></span>' +
        '<button type="button" class="share" id="copy-url">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1.1l1.4-1.4a5 5 0 0 0-7.1-7.1l-.8.8"/><path d="M14 11a5 5 0 0 0-7.1-.1l-1.4 1.4a5 5 0 0 0 7.1 7.1l.8-.8"/></svg>Copy link</button>' +
        '</div><section class="comments"><div class="comment-list" id="comment-list"><p class="empty">Loading comments…</p></div>' +
        '<form class="stack comment-form" id="comment-form">' +
        '<div class="replying-to hidden" id="replying-to"><span>Replying to <strong id="replying-to-name"></strong></span><button type="button" id="cancel-reply" aria-label="Cancel reply">×</button></div>' +
        '<input name="name" placeholder="Name" maxlength="40">' +
        '<textarea name="text" placeholder="Type your comment here…" required maxlength="2000"></textarea>' +
        '<button class="btn accent morph-btn" type="submit"><span class="lbl">Comment</span>' + MPComments.checkSVG() + "</button>" +
        "</form></section></article>";
      MPComments.init(id);
      document.getElementById("copy-url").onclick = function () {
        var link = "https://misereperdue.com/";
        if (navigator.clipboard) navigator.clipboard.writeText(link);
        this.lastChild.textContent = "Copied";
      };
      show("post", id);
    }

    nav.querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.view === "post") {
          if (b.classList.contains("bag-mode")) { show("cart"); return; }
          MPNav.reopen(); return;
        }
        show(b.dataset.view);
      };
    });

    if (location.hash === "#own") {
      MPComments.claimOwner();
      history.replaceState(null, "", "#");
    }
    if (location.hash === "#shop") show("shop");
    else if (location.hash === "#cart") show("cart");

    SanityBlog.loadPosts().then(function (list) {
      posts = list;
      var feed = document.getElementById("feed");
      posts.forEach(function (post) {
        var slug = post.slug || post._id;
        var date = (post.publishedAt || "").slice(0, 10);
        var author = post.author || "dc";
        var a = document.createElement("a");
        a.className = "card";
        a.href = "#post";
        a.innerHTML = byline(author, date) + "<h2>" + esc(post.title || "Untitled") + "</h2><p>" +
          esc(post.excerpt || SanityBlog.textFrom(post.body)[0] || "") + "</p>";
        a.onclick = function (e) { e.preventDefault(); openPost(slug); };
        feed.appendChild(a);
      });
    });

    MPShop.updateCartBadge();
  </script>
</body>
</html>
