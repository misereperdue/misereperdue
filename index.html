  <script>
    var nav = document.getElementById("nav");
    var posts = [];
    var current = { type: "journal", id: "" };

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
      });
    }
    function byline(name, date) {
      return '<div class="byline">' + MPComments.avatarHTML(name) +
        "<span>" + esc(name) + '</span><span class="bar">|</span><span>' + esc(date) + "</span></div>";
    }
    function refreshSeg() {
      requestAnimationFrame(function () {
        var t = current.type === "product" ? "shop" : current.type;
        var btn = nav.querySelector('button[data-view="' + t + '"]') ||
                  nav.querySelector('button[data-view="journal"]');
        if (btn) nav.querySelector(".seg").style.transform = "translateX(" + (btn.offsetLeft - 4) + "px)";
      });
    }
    function refreshPostBtn() {
      var btn = document.getElementById("post-btn");
      var badge = document.getElementById("post-badge");
      var cartBtn = document.getElementById("cart-btn");
      var split = nav.querySelector(".split");
      if (!btn || !window.MP) return;
      var onProduct = current.type === "product";
      var onPost = current.type === "post";
      var n = MP.cartCount();
      // the bag always lives in the sectioned area; on product pages the sectioned slot becomes the bag
      var bagMode = onProduct && n > 0;
      var showPencil = bagMode || onPost;
      var showSplit = bagMode || onPost || n > 0;
      btn.classList.toggle("bag-mode", bagMode);
      btn.style.display = showPencil ? "grid" : "none";
      if (split) split.style.display = showSplit ? "block" : "none";
      btn.setAttribute("aria-label", bagMode ? "Bag" : "Post");
      if (badge) {
        badge.classList.toggle("hidden", !bagMode || n === 0);
        badge.textContent = n > 99 ? "99+" : String(n);
      }
      // the sectioned bag replaces the regular cart tab on product pages
      if (cartBtn) cartBtn.classList.toggle("hidden", bagMode ? true : n === 0);
    }
    var viewScroll = {};
    function show(view, id) {
      // Save scroll position before leaving the current view
      var prevType = current.type === "product" ? "shop" : current.type;
      if (prevType) viewScroll[prevType] = window.scrollY;
      current = { type: view, id: id || "" };
      var reading = view === "post" || view === "product";
      // Restore default site hero when not viewing a post with custom header
      if (view !== "post") restoreHero();
      document.getElementById("journal").classList.toggle("on", view === "journal");
      document.getElementById("shop").classList.toggle("on", view === "shop");
      document.getElementById("cart").classList.toggle("on", view === "cart");
      document.getElementById("postview").classList.toggle("on", reading);
      nav.classList.toggle("shop", view === "shop");
      nav.classList.toggle("cart", view === "cart");
      nav.classList.toggle("reading", reading);
      nav.querySelectorAll("button").forEach(function (b) {
        var active = b.dataset.view === view ||
          (view === "product" && b.dataset.view === "shop");
        b.classList.toggle("on", active);
      });
      if (reading) window.scrollTo(0, 0);
      // Restore saved scroll position when returning to a view
      if (!reading) {
        var restoreKey = view === "product" ? "shop" : view;
        requestAnimationFrame(function() {
          if (viewScroll[restoreKey] !== undefined) {
            window.scrollTo(0, viewScroll[restoreKey]);
          } else if (view === "journal") {
            window.scrollTo(0, document.documentElement.scrollHeight);
          }
        });
      }
      if (view === "shop") MPShop.renderShop();
      if (view === "cart") MPShop.renderCartPanel();
      refreshSeg();
      refreshPostBtn();
      var hash = "#";
      if (view === "shop") hash = "#shop";
      else if (view === "cart") hash = "#cart";
      else if (view === "post" && id) hash = "#post/" + id;
      else if (view === "product" && id) hash = "#product/" + id;
      else if (reading) hash = "#post";
      if (location.hash !== hash) history.pushState(null, "", hash);
    }
    window.MPNav = {
      show: show,
      refreshSeg: refreshSeg,
      refreshPostBtn: refreshPostBtn,
      showProduct: function (id) { show("product", id); },
      reopen: function () {
        if (current.type === "product" && current.id) MPShop.openProduct(current.id);
        else if (current.type === "post" && current.id) openPost(current.id);
      }
    };

    var X_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';

    var defaultHeroHTML = null;
    function saveDefaultHero() {
      if (defaultHeroHTML === null) {
        var h = document.querySelector("header.hero");
        if (h) defaultHeroHTML = h.innerHTML;
      }
    }
    function restoreHero() {
      saveDefaultHero();
      var h = document.querySelector("header.hero");
      if (!h || h.getAttribute("data-custom") !== "1") return;
      // Crossfade back to default
      var layer = document.createElement("div");
      layer.className = "hero-cross";
      layer.innerHTML = defaultHeroHTML;
      h.appendChild(layer);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { layer.classList.add("in"); });
      });
      setTimeout(function () {
        h.innerHTML = defaultHeroHTML;
        h.removeAttribute("data-custom");
      }, 950);
    }
    function setPostHero(url) {
      saveDefaultHero();
      var h = document.querySelector("header.hero");
      if (!h) return;
      if (!url) { restoreHero(); return; }
      // Crossfade: layer new header over old, fade in, then clean up
      var isV = /\.(mp4|webm|mov)(\?|$)/i.test(url);
      var layer = document.createElement("div");
      layer.className = "hero-cross";
      layer.innerHTML = (isV
        ? '<video src="' + esc(url) + '" autoplay muted loop playsinline></video>'
        : '<img src="' + esc(url) + '" alt="">') +
        '<div class="hero-fade"></div>';
      h.setAttribute("data-custom", "1");
      h.appendChild(layer);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { layer.classList.add("in"); });
      });
      setTimeout(function () {
        var kids = Array.prototype.slice.call(h.children);
        kids.forEach(function (k) { if (k !== layer) h.removeChild(k); });
        layer.classList.remove("hero-cross");
        layer.classList.add("hero-post");
      }, 950);
    }

    function openPost(slug) {
      var post = posts.find(function (p) { return (p.slug || p._id) === slug; }) || posts[0];
      if (!post) return;
      var id = post.slug || post._id;
      current = { type: "post", id: id };
      var date = (post.publishedAt || "").slice(0, 10);
      var title = post.title || "Untitled";
      var author = post.author || "dc";
      var share = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(title) + "&url=" + encodeURIComponent("https://misereperdue.com/#post/" + id);
      setPostHero(post.header_media || "");
      document.getElementById("postview").innerHTML =
        '<article class="article-card"><div class="byline-row">' + byline(author, date) + tagDropdown(post.tags) + "</div>" +
        "<h1>" + esc(title) + "</h1>" + '<div class="post-body">' +
        (post.body || "") +
        '</div><div class="actions">' +
        '<a class="share" href="' + share + '" target="_blank" rel="noopener">' + X_SVG + "Share on X</a>" +
        '<span class="split"></span>' +
        '<button type="button" class="share" id="copy-url">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1.1l1.4-1.4a5 5 0 0 0-7.1-7.1l-.8.8"/><path d="M14 11a5 5 0 0 0-7.1-.1l-1.4 1.4a5 5 0 0 0 7.1 7.1l.8-.8"/></svg>Copy link</button>' +
        '</div><section class="comments"><div class="comment-list" id="comment-list"><div class="lg-spin-wrap"><span class="lg-spin" role="status" aria-label="Loading comments"></span></div></div>' +
        '<form class="stack comment-form" id="comment-form">' +
        '<div class="replying-to hidden" id="replying-to"><span>Replying to <strong id="replying-to-name"></strong></span><button type="button" id="cancel-reply" aria-label="Cancel reply">×</button></div>' +
        '<input name="name" placeholder="Name" maxlength="40">' +
        '<textarea name="text" placeholder="Type your comment here…" required maxlength="2000"></textarea>' +
        '<button class="btn accent morph-btn" type="submit"><span class="lbl">Comment</span>' + MPComments.checkSVG() + "</button>" +
        "</form></section></article>";
      MPComments.init(id);
      wireTagDropdown();
      document.getElementById("copy-url").onclick = function () {
        var link = "https://misereperdue.com/#post/" + id;
        if (navigator.clipboard) navigator.clipboard.writeText(link);
        this.lastChild.textContent = "Copied";
      };
      show("post", id);
    }

    nav.querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.view === "post") {
          if (b.classList.contains("bag-mode")) { show("cart"); return; }
          MPNav.reopen(); return;
        }
        show(b.dataset.view);
      };
    });

    if (location.hash === "#own") {
      MPComments.claimOwner();
      history.replaceState(null, "", "#");
    }
    function routeFromHash() {
      var h = location.hash || "#";
      var m;
      if ((m = h.match(/^#post\/(.+)$/))) {
        var slug = decodeURIComponent(m[1]);
        // Posts load async; openPost handles missing gracefully, retry after load
        if (posts && posts.length) openPost(slug);
        else {
          var iv = setInterval(function () {
            if (posts && posts.length) { clearInterval(iv); openPost(slug); }
          }, 200);
          setTimeout(function () { clearInterval(iv); }, 8000);
        }
        return true;
      }
      if ((m = h.match(/^#product\/(.+)$/))) {
        var pid = decodeURIComponent(m[1]);
        var tryOpen = function () {
          if (window.MPShop && MPShop.openProduct) MPShop.openProduct(pid);
        };
        tryOpen();
        // Retry once products load (Shopify fetch is async)
        var iv = setInterval(function () {
          if (window.MP && MP.PRODUCTS && MP.PRODUCTS[pid]) { clearInterval(iv); tryOpen(); }
        }, 500);
        setTimeout(function () { clearInterval(iv); }, 8000);
        return true;
      }
      if (h === "#shop") { show("shop"); return true; }
      if (h === "#cart") { show("cart"); return true; }
      if (h === "#journal" || h === "#") { show("journal"); return true; }
      return false;
    }
    routeFromHash();
    window.addEventListener("hashchange", routeFromHash);

    function tagDropdown(tags) {
      if (!tags || !tags.length) return "";
      if (tags.length <= 3) {
        return '<div class="ptags">' + tags.map(function (t) {
          return '<span class="ptag">' + esc(t) + "</span>";
        }).join("") + "</div>";
      }
      return '<div class="tagwrap"><button type="button" class="tagdrop" id="tagdrop">' +
        esc(tags.length + " Tags") + ' <span class="chev">▾</span></button>' +
        '<div class="tagmenu hidden" id="tagmenu">' +
        tags.map(function (t) {
          return '<span class="tagitem">' + esc(t) + "</span>";
        }).join("") + "</div></div>";
    }
    function wireTagDropdown() {
      var drop = document.getElementById("tagdrop");
      var menu = document.getElementById("tagmenu");
      if (!drop || !menu) return;
      drop.onclick = function (e) {
        e.stopPropagation();
        menu.classList.toggle("hidden");
        drop.querySelector(".chev").textContent = menu.classList.contains("hidden") ? "▾" : "▴";
      };
      document.addEventListener("click", function () {
        if (!menu.classList.contains("hidden")) {
          menu.classList.add("hidden");
          drop.querySelector(".chev").textContent = "▾";
        }
      });
    }
    function renderFeed(list) {
      var feed = document.getElementById("feed");
      if (!feed) return;
      feed.innerHTML = "";
      list.forEach(function (post) {
        var slug = post.slug || post._id;
        var date = (post.publishedAt || "").slice(0, 10);
        var author = post.author || "dc";
        var a = document.createElement("a");
        a.className = "card";
        a.href = "#post/" + slug;
        a.innerHTML = byline(author, date) + "<h2>" + esc(post.title || "Untitled") + "</h2><p>" +
          esc(post.excerpt || SanityBlog.textFrom(post.body)[0] || "") + "</p>";
        a.onclick = function (e) { e.preventDefault(); openPost(slug); };
        feed.appendChild(a);
      });
    }
    SanityBlog.loadPosts().then(function (list) {
      posts = list;
      renderFeed(posts);
    });

    MPShop.updateCartBadge();
  </script>
<script>
(function(){
  var badges = {
    shopify: "images/pay-shopify.png.b64",
    paypal: "images/pay-paypal.png.b64",
    visa: "images/pay-visa.png.b64"
  };
  Object.keys(badges).forEach(function(k){
    fetch(badges[k]).then(function(r){ return r.text(); }).then(function(b){
      var el = document.querySelector('img[data-paybadge="' + k + '"]');
      if (el && b.trim()) el.src = "data:image/png;base64," + b.trim();
    }).catch(function(){});
  });
})();
</script>
