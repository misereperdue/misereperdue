<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#000000">
  <title>MISERY</title>
  <link rel="stylesheet" href="css/site.css?v=26">
  <script src="js/theme.js?v=7"></script>
</head>
<body class="home">
  <header class="hero">
    <video class="sharp" autoplay muted loop playsinline preload="auto" poster="video/header.jpg">
      <source src="video/header-ping.mp4" type="video/mp4">
    </video>
    <video class="soft" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="video/header-ping.mp4" type="video/mp4">
    </video>
    <div class="hero-fade"></div>
  </header>
  <div class="nav-wrap">
    <nav class="nav" id="nav" aria-label="Main">
      <span class="seg" aria-hidden="true"></span>
      <button type="button" class="on" data-view="journal" aria-label="Home"><svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19V6.5L12 13l6-6.5V19"/></svg></button>
      <button type="button" data-view="shop" aria-label="Store">
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 8.5h11l-.8 10.2a1.5 1.5 0 0 1-1.5 1.3H8.8a1.5 1.5 0 0 1-1.5-1.3L6.5 8.5z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/></svg>
      </button>
      <span class="split" aria-hidden="true"></span>
      <button type="button" class="page-btn" data-view="post" aria-label="Post">
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.2 4.8l5 5L9.4 19.6 4.5 20l.4-4.9z"/><path d="M12.6 6.4l5 5"/></svg>
      </button>
    </nav>
  </div>
  <main class="page">
    <section class="panel on" id="journal"><div class="feed" id="feed"></div></section>
    <section class="panel" id="shop"><p class="empty">Nothing in the shop yet.</p></section>
    <section class="panel" id="postview"></section>
  </main>
  <script src="js/blog.js?v=6"></script>
  <script>
    var nav = document.getElementById("nav");
    var posts = [];
    var openSlug = "";
    function byline(date) {
      return '<div class="byline"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 18.5c.8-3 3.2-4.5 6.5-4.5s5.7 1.5 6.5 4.5"/></svg></span><span>dc</span><span class="bar">|</span><span>' + date + '</span></div>';
    }
    function show(view) {
      document.getElementById("journal").classList.toggle("on", view === "journal");
      document.getElementById("shop").classList.toggle("on", view === "shop");
      document.getElementById("postview").classList.toggle("on", view === "post");
      nav.classList.toggle("shop", view === "shop");
      nav.classList.toggle("reading", view === "post");
      nav.querySelectorAll("button").forEach(function (b) {
        b.classList.toggle("on", b.dataset.view === view);
      });
      requestAnimationFrame(function () {
        var btn = nav.querySelector('button[data-view="' + view + '"]');
        if (btn) nav.querySelector(".seg").style.transform = "translateX(" + (btn.offsetLeft - 4) + "px)";
      });
      history.replaceState(null, "", view === "shop" ? "#shop" : view === "post" ? "#post" : "#");
    }
    function esc(s) {
      return String(s || "").replace(/[&<>"]/g, function (c) {
        return { "&": "&", "<": "<", ">": ">", '"': """ }[c];
      });
    }
    function openPost(slug) {
      var post = posts.find(function (p) { return (p.slug || p._id) === slug; }) || posts[0];
      if (!post) return;
      openSlug = post.slug || post._id;
      var date = (post.publishedAt || "").slice(0, 10);
      var title = post.title || "Untitled";
      var share = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(title) + "&url=" + encodeURIComponent("https://misereperdue.com/");
      var xmark = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.7 3h3.1l-6.8 7.8L19 21h-3.2l-5-6.6L6.2 21H3.1l7.3-8.3L3 3h3.3l4.5 6L14.7 3zm-1.1 16.2h1.7L8.5 4.7H6.7l6.9 14.5z"/></svg>';
      document.getElementById("postview").innerHTML = '<article class="article-card">' + byline(date) + '<h1>' + title + '</h1><div class="post-body">' + SanityBlog.textFrom(post.body).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + '</div><div class="actions"><a class="share" href="' + share + '" target="_blank" rel="noopener">' + xmark + 'Share on X</a><span class="split"></span><button type="button" class="share" id="copy-url">' + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1.1l1.4-1.4a5 5 0 0 0-7.1-7.1l-.8.8"/><path d="M14 11a5 5 0 0 0-7.1-.1l-1.4 1.4a5 5 0 0 0 7.1 7.1l.8-.8"/></svg>Copy link</button></div><section class="comments"><h3>Comments</h3><div class="comment-list"><p class="empty">Loading comments…</p></div><form class="stack" id="comment-form"><input name="name" placeholder="Name" required><textarea name="text" placeholder="Comment" required></textarea><button class="btn" type="submit">Post</button></form></section></article>';
      fetch("https://api.github.com/repos/misereperdue/misereperdue/issues?state=all&labels=comment&per_page=100")
        .then(function (r) { return r.json(); })
        .then(function (list) {
          var rows = (list || []).filter(function (i) { return i.title === "comment:" + openSlug; });
          var box = document.querySelector("#postview .comment-list");
          if (!box) return;
          box.innerHTML = rows.length ? rows.map(function (i) {
            var parts = String(i.body || "").split("\n\n");
            var name = (parts[0] || i.user.login).replace(/^\*\*|\*\*$/g, "");
            return '<div class="comment"><strong>' + esc(name) + '</strong><p>' + esc(parts.slice(1).join("\n\n") || i.body) + '</p></div>';
          }).join("") : '<p class="empty">No comments yet.</p>';
        })
        .catch(function () {
          var box = document.querySelector("#postview .comment-list");
          if (box) box.innerHTML = '<p class="empty">Couldn’t load comments.</p>';
        });
      document.getElementById("copy-url").onclick = function () {
        var link = "https://misereperdue.com/";
        if (navigator.clipboard) navigator.clipboard.writeText(link);
        this.lastChild.textContent = "Copied";
      };
      document.getElementById("comment-form").onsubmit = function (e) {
        e.preventDefault();
        var data = new FormData(e.target);
        var url = "https://github.com/misereperdue/misereperdue/issues/new?labels=comment&title=" + encodeURIComponent("comment:" + openSlug) + "&body=" + encodeURIComponent("**" + data.get("name") + "**\n\n" + data.get("text"));
        window.open(url, "_blank");
      };
      show("post");
    }
    nav.querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.view === "post") { if (openSlug) openPost(openSlug); return; }
        show(b.dataset.view);
      };
    });
    if (location.hash === "#shop") show("shop");
    SanityBlog.loadPosts().then(function (list) {
      posts = list;
      var feed = document.getElementById("feed");
      posts.forEach(function (post) {
        var slug = post.slug || post._id;
        var date = (post.publishedAt || "").slice(0, 10);
        var a = document.createElement("a");
        a.className = "card";
        a.href = "#post";
        a.innerHTML = byline(date) + '<h2>' + (post.title || "Untitled") + '</h2><p>' + (post.excerpt || SanityBlog.textFrom(post.body)[0] || "") + '</p>';
        a.onclick = function (e) { e.preventDefault(); openPost(slug); };
        feed.appendChild(a);
      });
    });
  </script>
</body>
</html>
