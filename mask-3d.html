<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<title>Mis&egrave;re Perdue &middot; V_V Mask in 3D</title>
<meta name="description" content="Spin the Misery V_V silk sleeping mask in 3D. Misère Perdue, Toronto.">
<link rel="canonical" href="https://misereperdue.com/mask-3d">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mis&egrave;re Perdue">
<meta property="og:title" content="Mis&egrave;re Perdue &middot; V_V Mask in 3D">
<meta property="og:description" content="Spin the Misery V_V silk sleeping mask in 3D. Misère Perdue, Toronto.">
<meta property="og:url" content="https://misereperdue.com/mask-3d">
<meta property="og:image" content="https://misereperdue.com/img/mask-3d-front.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico?v=15" sizes="48x48"><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=15"><link rel="icon" type="image/png" sizes="96x96" href="/img/favicon-eyes-96.png?v=15"><link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-eyes-192.png?v=15">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a1230;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background .5s ease;
  }
  body.light { background: #e9ebf1; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hint {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 28px);
    text-align: center; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,255,255,.45); pointer-events: none;
    transition: opacity .8s ease;
  }
  body.light #hint { color: rgba(10,18,48,.4); }
  #hint.gone { opacity: 0; }
  #modeToggle {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.07);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    color: #fff; font-size: 14px; font-weight: 550; letter-spacing: .01em;
    cursor: pointer; font-family: inherit;
    transition: background .3s ease, color .3s ease, border-color .3s ease;
  }
  body.light #modeToggle {
    background: rgba(255,255,255,.65); color: #0a1230;
    border-color: rgba(10,18,48,.12);
  }
  #modeToggle .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ffd76a; box-shadow: 0 0 8px rgba(255,215,106,.8);
  }
  body.light #modeToggle .dot { background: #0a1230; box-shadow: none; }
  #fallback {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; padding: 24px;
  }
  #fallback img { width: min(86vw, 420px); border-radius: 18px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hint">Drag to spin</div>
<button id="modeToggle" type="button"><span class="dot"></span><span id="modeLabel">Light mode</span></button>
<div id="fallback"><img src="img/mask-front-light.jpg" alt="Sleep mask"></div>

<script type="module" src="/js/mask-3d-page.js?v=2"></script>
</body>
</html>
