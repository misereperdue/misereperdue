<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="view-transition" content="same-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f4f8">
  <title>Piece — MISERY</title>
  <link rel="stylesheet" href="css/site.css?v=9">
  <script src="js/theme.js?v=5"></script>
</head>
<body>
  <div class="nav-wrap">
    <nav class="nav" aria-label="Main">
      <a href="index.html" aria-label="Home"><span class="mark">M</span></a>
      <a class="active" href="store.html" aria-label="Store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M2.5 10h19"/><circle cx="16.5" cy="14.5" r="1"/></svg></a>
    </nav>
  </div>
  <main class="page" id="view"></main>
  <script src="js/store.js?v=5"></script>
  <script>
    var id = new URLSearchParams(location.search).get("id") || "jersey";
    var p = MP.PRODUCTS[id] || MP.PRODUCTS.jersey;
    var sized = id !== "book";
    document.getElementById("view").innerHTML = '<img src="' + p.image + '" alt="' + p.name + '" style="border-radius:22px"><h1 style="margin-top:16px">' + p.name + '</h1><div class="price">' + MP.money(p.price) + '</div>' + (sized ? '<div class="sizes">' + ["S","M","L","XL"].map(function (s, i) { return '<button type="button" data-size="' + s + '" class="' + (i === 1 ? "on" : "") + '">' + s + '</button>'; }).join("") + '</div>' : '<div style="height:12px"></div>') + '<button class="btn accent" id="add" type="button">Add to bag</button><p class="ok hidden" id="added">In the bag.</p>';
    var size = "M";
    document.querySelectorAll("[data-size]").forEach(function (b) {
      b.onclick = function () {
        size = b.dataset.size;
        document.querySelectorAll("[data-size]").forEach(function (x) { x.classList.remove("on"); });
        b.classList.add("on");
      };
    });
    document.getElementById("add").onclick = function () {
      MP.addItem(p.id, sized ? size : "one");
      document.getElementById("added").classList.remove("hidden");
    };
  </script>
</body>
</html>
