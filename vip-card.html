<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VIP</title>
<link rel="icon" href="/favicon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a1230;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background .5s ease;
  }
  body.light { background: #e9ebf1; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hint {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 28px);
    text-align: center; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,255,255,.45); pointer-events: none;
    transition: opacity .8s ease;
  }
  body.light #hint { color: rgba(10,18,48,.4); }
  #hint.gone { opacity: 0; }
  #modeToggle {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.07);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    color: #fff; font-size: 14px; font-weight: 550; letter-spacing: .01em;
    cursor: pointer; font-family: inherit;
    transition: background .3s ease, color .3s ease, border-color .3s ease;
  }
  body.light #modeToggle {
    background: rgba(255,255,255,.65); color: #0a1230;
    border-color: rgba(10,18,48,.12);
  }
  #modeToggle .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ffd76a; box-shadow: 0 0 8px rgba(255,215,106,.8);
  }
  body.light #modeToggle .dot { background: #0a1230; box-shadow: none; }
  #fallback {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; padding: 24px;
  }
  #fallback img { width: min(72vw, 320px); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<div id="hint">Drag to spin</div>
<button id="modeToggle" type="button"><span class="dot"></span><span id="modeLabel">Light mode</span></button>
<div id="fallback"><img src="img/vip-card-front.png" alt="VIP card"></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const stage = document.getElementById('stage');
const hint = document.getElementById('hint');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'flex';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 9.4);

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(3, 4, 7.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -3.4; key.shadow.camera.right = 3.4;
key.shadow.camera.top = 4.4; key.shadow.camera.bottom = -3.2;
key.shadow.camera.near = 1; key.shadow.camera.far = 24;
key.shadow.bias = -0.0002;
scene.add(key);
const rim = new THREE.DirectionalLight(0xbcd0ff, 0.9);
rim.position.set(-4, 2, -5);
scene.add(rim);
const sweep = new THREE.PointLight(0xffffff, 12, 30);
sweep.position.set(2.5, 1.2, 3.5);
scene.add(sweep);

// Backdrop that catches the card's real shadow (shadow follows the card's shape as it spins)
const shadowMat = new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.38 });
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), shadowMat);
backdrop.position.z = -1.15;
backdrop.receiveShadow = true;
scene.add(backdrop);

/* ---- Card ---- */
const W = 2.13, H = 3.0, R = 0.17, DEPTH = 0.055, BEVEL = 0.014;

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

const card = new THREE.Group();

// Solid body (rim + edge catch light)
const bodyGeo = new THREE.ExtrudeGeometry(roundedRectShape(W, H, R), {
  depth: DEPTH, bevelEnabled: true, bevelThickness: BEVEL, bevelSize: BEVEL, bevelSegments: 3, curveSegments: 24
});
bodyGeo.translate(0, 0, -DEPTH / 2);
const bodyMat = new THREE.MeshPhysicalMaterial({
  color: 0xf2f3f5, roughness: 0.38, metalness: 0.0,
  clearcoat: 0.7, clearcoatRoughness: 0.3, envMapIntensity: 0.7
});
const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
bodyMesh.castShadow = true;
bodyMesh.receiveShadow = true;
card.add(bodyMesh);

const loader = new THREE.TextureLoader();
function faceTexture(url, flipX) {
  const t = loader.load(url);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  applyUV(t, flipX);
  return t;
}
function dataTexture(url, flipX) {
  const t = loader.load(url);
  t.anisotropy = 4;
  applyUV(t, flipX);
  return t;
}
function applyUV(t, flipX) {
  if (flipX) {
    t.wrapS = THREE.RepeatWrapping;
    t.repeat.set(-1 / W, 1 / H);
  } else {
    t.repeat.set(1 / W, 1 / H);
  }
  t.offset.set(0.5, 0.5);
}

function faceMesh(url, roughUrl, bumpUrl, isBack) {
  const geo = new THREE.ShapeGeometry(roundedRectShape(W, H, R), 24);
  const mat = new THREE.MeshPhysicalMaterial({
    map: faceTexture(url, isBack),
    roughnessMap: dataTexture(roughUrl, isBack),
    bumpMap: dataTexture(bumpUrl, isBack),
    bumpScale: 0.6,
    roughness: 1.0, metalness: 0.0,
    clearcoat: 1.0, clearcoatRoughness: 0.24,
    envMapIntensity: 0.85
  });
  const m = new THREE.Mesh(geo, mat);
  if (isBack) {
    m.rotation.y = Math.PI;
    m.position.z = -(DEPTH / 2 + BEVEL + 0.0012);
  } else {
    m.position.z = DEPTH / 2 + BEVEL + 0.0012;
  }
  return m;
}
card.add(faceMesh('img/vip-card-front.png', 'img/vip-card-front-rough.png', 'img/vip-card-front-bump.png', false));
card.add(faceMesh('img/vip-card-back.png?v=3', 'img/vip-card-back-rough.png?v=2', 'img/vip-card-back-bump.png?v=2', true));
scene.add(card);

/* ---- Lanyard: ribbon loop through the card's slot, with lag/sway physics ---- */
const HOLE_Y = 1.30;
const lanyard = new THREE.Group();
scene.add(lanyard);

const strapCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3( 0.02, 0.00,  0.055),
  new THREE.Vector3(-0.16, 0.38,  0.050),
  new THREE.Vector3(-0.25, 0.85,  0.035),
  new THREE.Vector3(-0.24, 1.18,  0.018),
  new THREE.Vector3(-0.11, 1.38,  0.006),
  new THREE.Vector3( 0.00, 1.43,  0.000),
  new THREE.Vector3( 0.11, 1.38, -0.006),
  new THREE.Vector3( 0.24, 1.18, -0.018),
  new THREE.Vector3( 0.25, 0.85, -0.035),
  new THREE.Vector3( 0.16, 0.38, -0.050),
  new THREE.Vector3(-0.02, 0.00, -0.055)
]);
const STRAP_N = 72, STRAP_HALF = 0.08;
const strapGeo = new THREE.BufferGeometry();
const strapPos = new Float32Array((STRAP_N + 1) * 2 * 3);
const strapUV = new Float32Array((STRAP_N + 1) * 2 * 2);
strapGeo.setAttribute('position', new THREE.BufferAttribute(strapPos, 3));
strapGeo.setAttribute('uv', new THREE.BufferAttribute(strapUV, 2));
for (let i = 0; i <= STRAP_N; i++) {
  const u = i / STRAP_N;
  strapUV[(i * 2) * 2] = 0;     strapUV[(i * 2) * 2 + 1] = u * 7;
  strapUV[(i * 2 + 1) * 2] = 1; strapUV[(i * 2 + 1) * 2 + 1] = u * 7;
}
{
  const idx = [];
  for (let i = 0; i < STRAP_N; i++) {
    const a = i * 2, b = i * 2 + 1, c = i * 2 + 2, d = i * 2 + 3;
    idx.push(a, b, c, b, d, c);
  }
  strapGeo.setIndex(idx);
}
// Woven grosgrain fabric texture (fine ribs across the strap, darker selvedge edges)
function makeStrapTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#aad4ea';
  g.fillRect(0, 0, 128, 128);
  for (let y = 0; y < 128; y += 3) {
    g.fillStyle = 'rgba(255,255,255,0.13)';
    g.fillRect(0, y, 128, 1);
    g.fillStyle = 'rgba(70,110,140,0.12)';
    g.fillRect(0, y + 1, 128, 1);
  }
  const img = g.getImageData(0, 0, 128, 128);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 11;
    img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
  g.fillStyle = 'rgba(88,128,164,0.4)';
  g.fillRect(0, 0, 3, 128);
  g.fillRect(125, 0, 3, 128);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const strapTex = makeStrapTexture();
const strapMat = new THREE.MeshPhysicalMaterial({
  map: strapTex, bumpMap: strapTex, bumpScale: 0.12,
  roughness: 0.58, metalness: 0.0,
  sheen: 0.7, sheenRoughness: 0.5, sheenColor: 0xe2f3ff,
  side: THREE.DoubleSide, envMapIntensity: 0.5
});
const strap = new THREE.Mesh(strapGeo, strapMat);
strap.castShadow = true;
strap.receiveShadow = true;
strap.frustumCulled = false;
lanyard.add(strap);

const _p = new THREE.Vector3(), _t = new THREE.Vector3(), _z = new THREE.Vector3(0, 0, 1),
      _n0 = new THREE.Vector3(), _b0 = new THREE.Vector3(), _side = new THREE.Vector3();
function buildStrap(twist, flare) {
  for (let i = 0; i <= STRAP_N; i++) {
    const u = i / STRAP_N;
    strapCurve.getPoint(u, _p);
    _p.x *= (1 + flare);
    strapCurve.getTangent(u, _t);
    _n0.crossVectors(_t, _z).normalize();
    _b0.crossVectors(_t, _n0).normalize();
    const phi = twist * Math.sin(Math.PI * u);
    const c = Math.cos(phi), s = Math.sin(phi);
    _side.copy(_n0).multiplyScalar(c).addScaledVector(_b0, s);
    const o = i * 6;
    strapPos[o]     = _p.x - _side.x * STRAP_HALF;
    strapPos[o + 1] = _p.y - _side.y * STRAP_HALF;
    strapPos[o + 2] = _p.z - _side.z * STRAP_HALF;
    strapPos[o + 3] = _p.x + _side.x * STRAP_HALF;
    strapPos[o + 4] = _p.y + _side.y * STRAP_HALF;
    strapPos[o + 5] = _p.z + _side.z * STRAP_HALF;
  }
  strapGeo.attributes.position.needsUpdate = true;
  strapGeo.computeVertexNormals();
}
buildStrap(0, 0);

// Lanyard spring state (lags the card, overshoots, sways)
let lanY = -0.35, lanX = 0.10, lanZ = 0, lanVelY = 0, lanVelX = 0, lanVelZ = 0;

/* ---- Interaction: drag with inertia + spring settle ---- */
const REST_X = 0.10;
let rotX = REST_X, rotY = -0.35;
let velX = 0, velY = 0;
let dragging = false, lastX = 0, lastY = 0, lastT = 0;
let lastInteract = performance.now();
const el = renderer.domElement;

el.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
  velX = 0; velY = 0;
  el.setPointerCapture(e.pointerId);
  hint.classList.add('gone');
  lastInteract = performance.now();
});
el.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const now = performance.now();
  const dt = Math.max(1, now - lastT);
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  rotY += dx * 0.0085;
  rotX += dy * 0.006;
  rotX = Math.max(-1.15, Math.min(1.15, rotX));
  velY = (dx * 0.0085) / dt * 16.7;
  velX = (dy * 0.006) / dt * 16.7;
  lastX = e.clientX; lastY = e.clientY; lastT = now;
  lastInteract = now;
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  lastInteract = performance.now();
}
el.addEventListener('pointerup', endDrag);
el.addEventListener('pointercancel', endDrag);

const _hole = new THREE.Vector3();
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (!dragging) {
    // Spin inertia
    rotY += velY;
    velY *= 0.955;
    // Spring back to rest tilt — gives the wobble/settle from the reference
    const acc = (REST_X - rotX) * 0.045;
    velX = (velX + acc) * 0.90;
    rotX += velX;
    // Gentle idle rotation after a pause
    if (performance.now() - lastInteract > 2600 && Math.abs(velY) < 0.002) {
      rotY += 0.0035;
    }
  }
  card.rotation.set(rotX, rotY, 0);
  card.position.y = Math.sin(t * 1.15) * 0.035;
  card.rotation.z = Math.sin(t * 0.7) * 0.008;

  // Lanyard: anchored at the card's slot, rotation trails the card on springs
  card.updateMatrixWorld();
  _hole.set(0, HOLE_Y, 0);
  card.localToWorld(_hole);
  lanyard.position.copy(_hole);
  lanVelY += (rotY - lanY) * 0.045; lanVelY *= 0.875; lanY += lanVelY;
  lanVelX += (rotX - lanX) * 0.060; lanVelX *= 0.860; lanX += lanVelX;
  const zTarget = THREE.MathUtils.clamp(-velY * 0.05, -0.3, 0.3) + Math.sin(t * 1.3) * 0.012;
  lanVelZ += (zTarget - lanZ) * 0.05; lanVelZ *= 0.90; lanZ += lanVelZ;
  lanyard.rotation.set(lanX, lanY, lanZ);
  const lag = rotY - lanY;
  buildStrap(
    THREE.MathUtils.clamp(lag * 0.8, -1.15, 1.15),
    THREE.MathUtils.clamp(Math.abs(lag) * 0.10, 0, 0.22)
  );

  // Light sweep follows the spin, like the reference's moving highlight
  sweep.position.x = Math.sin(rotY) * 3.2 + 1.2;
  sweep.position.y = Math.cos(rotX * 1.4) * 1.6 + 0.6;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---- Light / dark toggle ---- */
const toggle = document.getElementById('modeToggle');
const label = document.getElementById('modeLabel');
toggle.addEventListener('click', () => {
  const light = document.body.classList.toggle('light');
  label.textContent = light ? 'Dark mode' : 'Light mode';
  key.intensity = light ? 1.9 : 1.6;
  renderer.toneMappingExposure = light ? 1.12 : 1.05;
  shadowMat.opacity = light ? 0.22 : 0.38;
});
</script>
</body>
</html>
