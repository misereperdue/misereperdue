<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <link rel="apple-touch-icon" href="/img/app-icon-tint-180.png?v=23">
  <title>VIP Checkout — MISÈRE PERDUE</title>
  <meta name="description" content="VIP checkout for MISÈRE PERDUE.">
  <link rel="preconnect" href="https://cdn.whop.com" crossorigin>
  <link rel="preconnect" href="https://api.whop.com" crossorigin>
  <link rel="preconnect" href="https://api.misereperdue.com" crossorigin>
  <link rel="preload" as="script" href="https://cdn.whop.com/elements/amber/elements.js">
  <script src="/js/theme.js?v=10"></script>
  <style>
    :root { color-scheme:light; --bg:#fff; --ink:#1c1c1e; --muted:#636366; --hair:rgba(0,0,0,.08); --fill:#f4f4f6; --button:#0a1230; --button-ink:#fff; --ok:#1c1c1e; }
    [data-theme="dark"] { color-scheme:dark; --bg:#070f29; --ink:#f5f5f7; --muted:#b7bdd0; --hair:rgba(255,255,255,.14); --fill:rgba(255,255,255,.06); --button:#dfe5ee; --button-ink:#111a32; --ok:#f5f5f7; }
    *,*::before,*::after { box-sizing:border-box; }
    html,body { margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased; }
    .wrap { max-width:480px;margin:0 auto;padding:40px 20px 72px; }
    .brand { display:block;text-align:center;font-size:12px;letter-spacing:.18em;font-weight:650;color:var(--muted);margin:0 0 28px;text-decoration:none; }
    .tag { display:none; }
    /* receipt head */
    .rc-head { display:flex;align-items:center;gap:14px; }
    .rc-art { width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;background:var(--fill);box-shadow:0 0 0 1px var(--hair); }
    .rc-title { min-width:0; }
    h1 { font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px; }
    .rc-sub { margin:0;color:var(--muted);font-size:13px;line-height:1.35; }
        .rc-sub b { font-weight:600;color:var(--ink); }
    .rc-note { color:var(--muted);font-size:12px;line-height:1.5;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--hair); }
    /* actions & states */
    button { width:100%;border:0;background:var(--button);color:var(--button-ink);border-radius:14px;height:52px;padding:0 18px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:20px;transition:transform .15s ease,opacity .2s; }
    button:active { transform:scale(.985); }
    button:focus-visible,a:focus-visible { outline:2px solid var(--ink);outline-offset:3px; }
    button:disabled { opacity:.5;cursor:default; }
    button.ghost { background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair); }
    #checkout { margin:6px -16px 0;min-height:0;transition:opacity .35s ease; }
    #checkout.loading { opacity:0;height:0;overflow:hidden; }
    #message { color:var(--muted);font-size:13px;line-height:1.5;margin:14px 0 0;text-align:center; }
    #message:empty { display:none; }
    .skel { margin-top:18px;display:grid;gap:12px; }
    .skel i { display:block;height:46px;border-radius:12px;background:var(--fill);position:relative;overflow:hidden; }
    .skel i:first-child { height:40px;width:42%;margin:6px auto 10px; }
    .skel i:nth-child(3) { height:150px; }
    .skel i:last-child { height:52px;border-radius:14px; }
    .skel i::after { content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 7%,transparent),transparent);animation:sk 1.3s ease-in-out infinite; }
    @keyframes sk { to { transform:translateX(100%); } }
    .done { text-align:center;padding:26px 0 8px; }
    .done svg { width:64px;height:64px;color:var(--ok); }
    .done circle { stroke-dasharray:166;stroke-dashoffset:166;animation:dr .6s cubic-bezier(.65,0,.45,1) forwards; }
    .done path { stroke-dasharray:48;stroke-dashoffset:48;animation:dr .35s .5s cubic-bezier(.65,0,.45,1) forwards; }
    @keyframes dr { to { stroke-dashoffset:0; } }
    .done h2 { font-size:20px;font-weight:600;margin:14px 0 4px; }
    .done p { color:var(--muted);font-size:13px;margin:0; }
    .done-close { width:auto;min-width:0;height:36px;padding:0 16px;margin:16px auto 0;display:inline-block;border-radius:999px;font-size:14px;font-weight:600; }
    .fine { color:var(--muted);font-size:11px;line-height:1.6;margin:22px 0 0;text-align:center; }
    .fine a { color:inherit; }
    [hidden] { display:none !important; }
    /* sheet mode: the site draws the sheet, grab handle and close button */
    .mp-sheet .wrap { padding:4px 20px 24px; }
    /* dc t661u: never scroll sideways in the sheet (fields, coupon particles, ticket). */
    html.mp-sheet,html.mp-sheet body { overflow-x:hidden;max-width:100%;touch-action:pan-y; }
    html.mp-sheet .wrap { overflow-x:hidden;max-width:100%; }
    html.mp-dock .wrap { padding:0 10px 14px; }
    .mp-sheet .brand, .mp-sheet .fine.page { display:none; }
    .mp-sheet .rc-head { padding-right:0; }
    /* Neutralize Whop's dialog ::backdrop. The parent sheet paints the dim so the
       grabber strip and checkout fade together. */
    html.mp-sheet dialog[data-element-overlay]::backdrop {
      background: transparent !important;
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
      animation: none !important;
    }
    html.mp-sheet dialog[data-element-overlay][data-element-lowered] {
      background: transparent !important;
      box-shadow: none !important;
    }
    html.mp-sheet.mp-peek .rc-note { display: none; }
    /* clothing bag (per dc): item lines and the shipping address form */
    .cart-lines { list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px; }
    .cart-lines li { display:flex;align-items:center;gap:12px;font-size:14px; }
    .cart-lines li img { width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none;background:var(--fill);box-shadow:0 0 0 1px var(--hair); }
    .cart-lines li span { flex:1;min-width:0; }
    .rc-stack { position:relative;width:56px;height:56px;flex:none; }
    .rc-stack img { position:absolute;width:40px;height:40px;border-radius:11px;object-fit:cover;background:var(--fill);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--hair); }
    .rc-stack img:nth-child(1) { left:0;top:0;z-index:3; }
    .rc-stack img:nth-child(2) { left:16px;top:16px;z-index:2; }
    .rc-stack.n3 img:nth-child(2) { left:8px;top:8px; }
    .rc-stack.n3 img:nth-child(3) { left:16px;top:16px;z-index:1; }
    .cart-lines b { font-weight:600; }
    .ship { margin:18px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px; }
    .ship-h { grid-column:1/-1;margin:0 0 2px;font-size:13px;font-weight:600;color:var(--muted); }
    .ship-f { display:grid;gap:4px;grid-column:1/-1; }
    .ship-city,.ship-region,.ship-postal,.ship-country { grid-column:auto; }
    .ship-f span { font-size:12px;color:var(--muted); }
    .ship-f input { font:inherit;font-size:16px;height:44px;padding:0 12px;border-radius:12px;border:0;background:var(--fill);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair);width:100%; }
    .ship-f input:focus { outline:2px solid var(--ink);outline-offset:1px; }
    @media (prefers-reduced-motion:reduce) { .skel i::after,.done circle,.done path { animation:none;stroke-dashoffset:0; } }
    /* Native checkout, look A (dc t667u/t668u): iOS-style grouped glass lists; only Whop's card frames and branding line are Whop's. */
    :root { --glass-tint:rgba(255,255,255,.55); --glass-blur:blur(24px) saturate(160%); --glass-line:rgba(0,0,0,.08); --glass-spec:inset 0 1px 0 rgba(255,255,255,.55); --good:#248a3d; --bad:#d70015; --sep:rgba(60,60,67,.16); }
    [data-theme="dark"] { --glass-tint:rgba(255,255,255,.06); --glass-line:rgba(255,255,255,.14); --glass-spec:inset 0 1px 0 rgba(255,255,255,.12); --good:#30d158; --bad:#ff6961; --sep:rgba(235,235,245,.14); }
    html.mp-native.mp-sheet,html.mp-native.mp-sheet body { background:transparent; }
    html.mp-native #checkout { margin:4px 0 0; }
    html.mp-native #receipt { display:none; }
    .nc { display:grid;gap:0;min-width:0; }
    .nc svg { width:18px;height:18px;flex:none; }
    .nc-grp { background:var(--glass-tint);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border-radius:16px;box-shadow:var(--glass-spec),0 0 0 .5px var(--glass-line);overflow:hidden;min-width:0; }
    .nc-grp > * + *,.nc-new > * + *,.nc-methods > * + *,.nc-methods:not(:empty) + .nc-new { border-top:.5px solid var(--sep) !important; }
    .nc-grp > [hidden],.nc-new[hidden],.nc-add[hidden] { display:none !important; }
    .nc-cap { margin:18px 14px 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted); }
    .nc .nc-li { all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 14px;font-size:15px;color:var(--ink);min-width:0;-webkit-tap-highlight-color:transparent; }
    button.nc-li,label.nc-li { cursor:pointer; }
    .nc-lb { width:74px;flex:none;font-size:15px; }
    .nc-lb-s { width:auto; }
    .nc-lt { flex:1;min-width:0;display:grid; }
    .nc-lt small { font-size:12px;color:var(--good); }
    .nc-v { margin-left:auto;display:flex;align-items:center;gap:2px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap; }
    .nc-v svg { width:16px;height:16px; }
    .nc-in { flex:1;min-width:0;height:44px;border:0;margin:0;padding:0 12px;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:0;-webkit-appearance:none;appearance:none;border-radius:0; }
    .nc-in::placeholder { color:var(--muted);opacity:.75; }
    .nc-sel { flex:1;min-width:0;display:flex;align-items:center;position:relative; }
    .nc-sel select { padding-right:28px;cursor:pointer; }
    .nc-sel svg { position:absolute;right:0;color:var(--muted);pointer-events:none;width:16px;height:16px; }
    .nc-cline .nc-lt { display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    #nc-postal { text-transform:uppercase; }
    #nc-postal::placeholder { text-transform:none; }
    .nc-item { min-height:56px; }
    .nc-art { width:34px;height:34px;border-radius:9px;object-fit:cover;flex:none;background:var(--fill); }
    .nc-it { flex:1;min-width:0;display:grid; }
    .nc-it b { font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .nc-it small { font-size:12px;color:var(--muted); }
    .nc-totrow { min-height:50px; }
    .nc-totrow .nc-lt b { font-weight:600; }
    .nc-cl { display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.32,.72,0,1); }
    .nc-cl > .nc-li { overflow:hidden;min-height:0;opacity:0;transform:translateX(-14px);transition:opacity .35s ease .1s,transform .45s cubic-bezier(.32,.72,0,1) .1s,min-height .45s cubic-bezier(.32,.72,0,1);color:var(--good); }
    .nc-cl .nc-v { color:var(--good); }
    .has-coupon .nc-cl { grid-template-rows:1fr; }
    .has-coupon .nc-cl > .nc-li { opacity:1;transform:none;min-height:46px; }
    .nc-grp > .nc-cl { border-top-width:0 !important; }
    .has-coupon .nc-grp > .nc-cl { border-top-width:.5px !important; }
    .nc-cbox { gap:8px !important; padding:6px 8px 6px 14px !important; }
    .nc-cin { flex:1;min-width:0;font:inherit;font-size:16px;height:36px;padding:0;border:0;background:transparent;color:var(--ink);outline:0;text-transform:uppercase;letter-spacing:.04em; }
    .nc-cin::placeholder { text-transform:none;letter-spacing:0;color:var(--muted);opacity:.75; }
    .nc button.nc-chk,.nc button.nc-tk-apply { width:auto;margin:0;height:34px;border-radius:999px;padding:0 14px;font-size:14px;background:var(--fill);color:var(--ink); }
    .nc-tkrow { padding:8px !important; }
    .nc-ticket { position:relative;display:flex;align-items:stretch;flex:1;min-width:0;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--ink) 9%,transparent),color-mix(in srgb,var(--ink) 3%,transparent));box-shadow:inset 0 0 0 .5px var(--glass-line),var(--glass-spec);transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .3s ease;
      -webkit-mask:radial-gradient(circle 8px at 34% 0,transparent 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 8px at 34% 100%,transparent 98%,#000) bottom/100% 51% no-repeat;
      mask:radial-gradient(circle 8px at 34% 0,transparent 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 8px at 34% 100%,transparent 98%,#000) bottom/100% 51% no-repeat; }
    .nc-ticket.is-gone { transform:scale(.6);opacity:0; }
    .nc-tk-l { width:34%;padding:10px 10px 10px 14px;border-right:1.5px dashed var(--glass-line);display:grid;align-content:center;gap:2px;min-width:0; }
    .nc-tk-l small { font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase; }
    .nc-tk-l b { font-size:14px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis; }
    .nc-tk-r { flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 12px;min-width:0; }
    .nc-tk-r b { font-size:19px;font-weight:700;letter-spacing:-.02em; }
    .nc-cmsg { margin:8px 14px 0;font-size:12px;color:var(--muted); }
    .nc-cmsg:empty { display:none; }
    .nc-pt { position:fixed;z-index:50;border-radius:50%;background:var(--ink);pointer-events:none;box-shadow:0 0 6px color-mix(in srgb,var(--ink) 40%,transparent); }
    .nc-thumb { width:0;height:26px;margin-right:-10px;border-radius:8px;display:grid;place-items:center;overflow:hidden;opacity:0;transform:scale(.5);color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);transition:width .4s cubic-bezier(.32,.72,0,1),margin .4s cubic-bezier(.32,.72,0,1),opacity .3s ease,transform .45s cubic-bezier(.34,1.56,.64,1);flex:none; }
    .nc-thumb svg { width:15px;height:15px; }
    .has-coupon .nc-thumb { width:26px;margin-right:0;opacity:1;transform:none; }
    .nc-tot { margin-left:auto;display:flex;align-items:baseline;gap:8px; }
    .nc-now { font-size:17px;font-weight:650;letter-spacing:-.01em;display:inline-flex;line-height:1;height:1em;overflow:hidden;font-variant-numeric:tabular-nums; }
    .nc-old { font-size:13px;color:var(--muted);opacity:0;max-width:0;overflow:hidden;white-space:nowrap;transition:opacity .35s ease,max-width .5s cubic-bezier(.32,.72,0,1); }
    .has-coupon .nc-old { opacity:1;max-width:90px; }
    .nc-saved { opacity:0;max-height:0;transition:opacity .4s ease .35s,max-height .4s ease .2s; }
    .has-coupon .nc-saved { opacity:1;max-height:18px; }
    .nc-od { display:inline-block;height:1em;overflow:hidden; }
    .nc-odc { display:flex;flex-direction:column; }
    .nc-odc i { font-style:normal;height:1em;line-height:1; }
    .nc-ods { display:inline-block;line-height:1; }
    .nc-wrow { padding-right:6px !important; }
    .nc-wrow .nc-lb { margin-right:-12px; }
    .nc-mount { min-width:0;max-width:100%; }
    .nc-mount iframe,.nc-mount > * { max-width:100% !important; }
    .nc-f { flex:1;min-height:44px; }
    .nc-f:empty { border-radius:8px;background:color-mix(in srgb,var(--ink) 5%,transparent);margin:8px 0; }
    .nc-sp2 { display:flex;min-width:0; }
    .nc-sp2 > .nc-li { flex:1;width:auto; }
    .nc-sp2 > .nc-li + .nc-li { border-left:.5px solid var(--sep); }
    .nc-sp2 .nc-lb { width:auto; }
    .nc-savecard input { width:20px;height:20px;margin:0;accent-color:var(--ink);flex:none; }
    .nc-savecard .nc-lt { font-size:15px;color:var(--ink); }
    .nc-m { min-height:56px !important; }
    .nc-mi { width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);flex:none; }
    .nc-mt { flex:1;display:grid;gap:1px;font-size:15px;min-width:0; }
    .nc-mt b { font-weight:500; }
    .nc-mt small { color:var(--muted);font-size:12px; }
    .nc-mk { width:22px;height:22px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--sep);color:transparent;flex:none; }
    .nc-mk svg { width:14px;height:14px; }
    .nc-m[aria-checked="true"] .nc-mk { background:var(--ink);color:var(--bg);box-shadow:none; }
    .nc-err { margin:12px 14px 0;color:var(--bad);font-size:13px;text-align:center; }
    .nc-err:empty { display:none; }
    .nc-foot { display:grid;gap:10px;margin-top:16px; }
    .nc-wallet[hidden] { display:none !important; }
    .nc button.nc-wbtn,.nc button.nc-go { width:100%;margin:0;height:50px;border-radius:999px;padding:0 18px;font-size:16px;font-weight:650; }
    .nc button.nc-wbtn { background:#000;color:#fff;display:flex;align-items:center;justify-content:center;gap:4px;font-size:18px; }
    [data-theme="dark"] .nc button.nc-wbtn { background:#fff;color:#000; }
    .nc-wbtn img { height:22px;width:auto; }
    .nc-apl { font-size:19px;line-height:1; }
    .nc button.nc-go { background:var(--button);color:var(--button-ink);font-variant-numeric:tabular-nums; }
    .nc button.nc-go:disabled { opacity:.45; }
    .is-busy .nc-go { opacity:.7; }
    .nc-brand { margin-top:10px;opacity:.7;transform:scale(.9);transform-origin:center top; }
    .nc-brand:empty { display:none; }
    @media (prefers-reduced-motion:reduce) { .nc *,.nc *::after { transition:none !important;animation:none !important; } }
  </style>
  <script src="https://cdn.whop.com/elements/amber/elements.js" data-whop-elements defer></script>
  <script src="/js/native-checkout.js?v=2" defer></script>
  <script src="/js/whop-vip-preview.js?v=26" defer></script>
</head>
<body>
  <main class="wrap">
    <a class="brand" href="/">MISÈRE PERDUE</a><span class="tag">VIP</span>
    <section id="receipt">
      <div class="rc-head">
        <img class="rc-art" src="/img/og/membership-sq.jpg" alt="" width="112" height="112">
        <div class="rc-title"><h1>VIP Membership</h1><p class="rc-sub"><span class="renew">Then <b>—</b> every 30 days</span><span class="price" hidden><strong></strong></span></p></div>
      </div>
      <p class="rc-note" id="pricing-note"></p>
    </section>
    <div class="skel" id="skel" hidden aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="checkout" aria-label="Payment" hidden></div>
    <button id="begin" type="button">Continue to payment</button>
    <div id="message" role="status" aria-live="polite"></div>
    <button id="cancel-test" class="ghost" type="button" hidden>Stop test renewal</button>
    <p class="fine page">Payment is confirmed by our server before VIP is added. <a href="/shop">Return to shop</a></p>
  </main>
</body>
</html>
